<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公開版 · 儀表板 — 心臟外科手術病人管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #FAF7F2;
  --paper: #FFFFFF;
  --ink: #1A1A1A;
  --ink-soft: #5C5C5C;
  --ink-faint: #8A8580;
  --teal: #1F5A5A;
  --teal-tint: #F5F9F9;
  --teal-soft: #E6EDED;
  --gold: #A87B4D;
  --plum: #6B5876;
  --plum-tint: #F2EFF4;
  --navy: #2C4866;
  --navy-tint: #EEF2F7;
  --border: #E8E2D5;
  --border-strong: #D4CDB8;
  --success: #4A7A5A;
  --success-bg: #EDF3EE;
  --warn: #B8842D;
  --warn-bg: #FBF3DE;
  --error: #B85450;
  --error-bg: #FBEFEE;
}

body {
  font-family: 'Noto Sans TC', system-ui, sans-serif;
  background: var(--cream);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.6;
  padding: 20px 16px 60px;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1080px; margin: 0 auto; }

/* ========== Header ========== */
header {
  margin: 16px 0 24px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand .eyebrow {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 6px;
}
.brand h1 {
  font-family: 'Noto Serif TC', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--ink);
}
.role-tag {
  background: var(--navy);
  color: white;
  padding: 4px 12px;
  border-radius: 3px;
  font-size: 12px;
  letter-spacing: 0.1em;
  font-weight: 500;
}
.as-of {
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: 4px;
}

/* ========== Key Bar ========== */
.key-bar {
  background: var(--navy-tint);
  border: 1px solid #DCE3EB;
  border-radius: 3px;
  padding: 12px 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.key-bar label { font-size: 13px; color: var(--navy); font-weight: 500; }
.key-bar input {
  flex: 1;
  min-width: 180px;
  padding: 7px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: white;
}
.key-bar input:focus {
  outline: none;
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(44, 72, 102, 0.12);
}
.btn-refresh {
  padding: 7px 14px;
  background: var(--paper);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
  font-family: inherit;
}
.btn-refresh:hover { border-color: var(--navy); color: var(--navy); }

/* ========== Section title ========== */
.section-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 17px;
  color: var(--ink);
  font-weight: 600;
  margin: 30px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.section-title .num {
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 0.1em;
}
.section-title .sub {
  font-size: 12px;
  color: var(--ink-faint);
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 400;
  margin-left: auto;
}

/* ========== Overview cards ========== */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
@media (max-width: 760px) { .overview-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 400px) { .overview-grid { grid-template-columns: 1fr; } }

.ov-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent);
  border-radius: 3px;
  padding: 16px 18px;
}
.ov-card[data-accent="teal"]  { --accent: var(--teal); }
.ov-card[data-accent="gold"]  { --accent: var(--gold); }
.ov-card[data-accent="plum"]  { --accent: var(--plum); }
.ov-card[data-accent="navy"]  { --accent: var(--navy); }
.ov-label {
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  font-weight: 500;
}
.ov-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.1;
}
.ov-value.placeholder { color: var(--ink-faint); font-size: 24px; }
.ov-unit {
  font-size: 12px;
  color: var(--ink-faint);
  margin-left: 4px;
}

/* ========== Tabs ========== */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 0;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 9px 16px;
  font-family: inherit;
  font-size: 14px;
  border: 1px solid transparent;
  border-bottom: none;
  background: transparent;
  cursor: pointer;
  color: var(--ink-soft);
  font-weight: 500;
  margin-bottom: -1px;
  transition: all 0.15s;
}
.tab:hover { color: var(--ink); }
.tab.active {
  background: var(--paper);
  border-color: var(--border);
  color: var(--navy);
  font-weight: 600;
}
.tab .count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-faint);
  margin-left: 4px;
}
.tab.active .count { color: var(--navy); }

.tab-content {
  background: var(--paper);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 3px 3px;
  min-height: 100px;
}

/* ========== Patient list ========== */
.plist {
  list-style: none;
}
.plist-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1.2fr 0.8fr;
  gap: 12px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  align-items: center;
}
.plist-row:last-child { border-bottom: none; }
.plist-row:hover { background: var(--cream); }
.plist-row.header {
  font-size: 12px;
  color: var(--ink-faint);
  font-weight: 500;
  letter-spacing: 0.05em;
  background: var(--cream);
  border-bottom: 1px solid var(--border-strong);
}
.plist-row .name { font-weight: 500; }
.plist-row .meta { color: var(--ink-soft); font-size: 13px; }
.plist-row .date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink);
}
.plist-row .surgery { color: var(--gold); font-weight: 500; font-size: 13px; }
.plist-empty {
  padding: 28px;
  text-align: center;
  color: var(--ink-faint);
  font-style: italic;
  font-size: 13px;
}
.status-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}
.status-pill.scheduled { background: var(--warn-bg); color: var(--warn); }
.status-pill.completed { background: var(--success-bg); color: var(--success); }
.status-pill.cancelled { background: #F0EEEA; color: var(--ink-faint); }
.status-pill.reschedule { background: var(--plum-tint); color: var(--plum); }
@media (max-width: 600px) {
  .plist-row { grid-template-columns: 1fr; gap: 4px; padding: 12px 16px; }
  .plist-row.header { display: none; }
}

/* ========== Metric stat cards ========== */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
@media (max-width: 760px) { .metric-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .metric-grid { grid-template-columns: 1fr; } }

.mc {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.mc-label {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.4;
}
.mc-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 600;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.mc-value.muted { color: var(--ink-faint); font-size: 16px; font-weight: 500; }
.mc-value .unit { font-size: 13px; color: var(--ink-faint); font-weight: 400; }
.mc-meta {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 2px;
}
.mc.pending { background: #FAF7EE; border-style: dashed; }
.mc.pending .mc-meta { color: var(--warn); font-style: italic; }

/* Rates */
.rate-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (max-width: 600px) { .rate-grid { grid-template-columns: 1fr; } }
.rate-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-left: 4px solid var(--plum);
  border-radius: 3px;
  padding: 18px 20px;
}
.rate-label {
  font-size: 14px;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 4px;
}
.rate-def {
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 12px;
  font-style: italic;
}
.rate-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 600;
  color: var(--plum);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.rate-value .unit { font-size: 14px; font-weight: 400; color: var(--ink-soft); }
.rate-frac {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 4px;
}
.rate-value.muted { color: var(--ink-faint); font-size: 18px; }

/* ========== ERAS / 非ERAS 兩組並列對照 ========== */
.group-legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--ink-soft);
}
.group-legend .gl-item { display: inline-flex; align-items: center; gap: 6px; }
.group-legend .gl-dot {
  width: 10px; height: 10px; border-radius: 3px; display: inline-block;
}
.group-legend .gl-dot.eras { background: var(--teal); }
.group-legend .gl-dot.non  { background: var(--gold); }

/* metric card 內兩欄 */
.mc-compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 6px;
}
.mc-col {
  border-left: 3px solid var(--gc);
  padding-left: 9px;
}
.mc-col.eras { --gc: var(--teal); }
.mc-col.non  { --gc: var(--gold); }
.mc-col .mc-col-tag {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--gc);
  margin-bottom: 3px;
}
.mc-col .mc-value { font-size: 20px; }
.mc-col .mc-value .unit { font-size: 11px; }

/* rate card 內兩欄 */
.rate-compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 4px;
}
.rate-col {
  border-left: 3px solid var(--gc);
  padding-left: 11px;
}
.rate-col.eras { --gc: var(--teal); }
.rate-col.non  { --gc: var(--gold); }
.rate-col .tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--gc);
  margin-bottom: 4px;
}
.rate-col .rate-value { color: var(--gc); font-size: 26px; }
.rate-col .rate-value.muted { color: var(--ink-faint); font-size: 18px; }
@media (max-width: 400px) {
  .rate-compare { grid-template-columns: 1fr; gap: 10px; }
}

/* ========== ★2026-09 篩選列 / 類別總覽 / 統計卡 ========== */
.filter-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-left: 4px solid var(--teal);
  border-radius: 3px;
  padding: 14px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.filter-row { display: flex; flex-direction: column; gap: 6px; }
.filter-row.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.filter-row.two > div { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 560px) { .filter-row.two { grid-template-columns: 1fr; } }
.filter-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink-soft);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.chip:hover { border-color: var(--teal); color: var(--teal); }
.chip.active { background: var(--teal); border-color: var(--teal); color: white; font-weight: 500; }
.chip .chip-n {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  opacity: 0.8;
}
.filter-summary {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  font-size: 13px;
  color: var(--ink-soft);
}
.filter-summary strong { color: var(--ink); font-weight: 600; }
.small-n {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 10px;
  background: var(--warn-bg);
  color: var(--warn);
  font-size: 10px;
  font-weight: 600;
  vertical-align: middle;
  letter-spacing: 0.04em;
}
.stat-legend {
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 10px;
  font-style: italic;
}
.mc-stats {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
}
.mc-stats strong { color: var(--ink); font-weight: 600; }
.mc-stats .u { font-size: 10px; color: var(--ink-faint); margin-left: 1px; }

.cat-table-wrap {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow-x: auto;
}
.cat-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 700px;
}
.cat-table th, .cat-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
}
.cat-table th {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  background: var(--cream);
}
.cat-table th.num, .cat-table td.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
.cat-table td.num .u { font-size: 10px; color: var(--ink-faint); margin-left: 2px; }
.cat-table td.num .frac { display: block; font-size: 10px; color: var(--ink-faint); }
.cat-table td .muted { color: var(--ink-faint); }
.cat-table td .warn { color: var(--error); font-weight: 600; }
.cat-table .cat-row[data-cat] { cursor: pointer; }
.cat-table .cat-row[data-cat]:hover { background: var(--teal-tint); }
.cat-table .cat-row.selected { background: var(--teal-soft); }
.cat-table .cat-row.selected .cat-name { color: var(--teal); font-weight: 600; }
.cat-table .cat-row.total td { border-top: 2px solid var(--border-strong); border-bottom: none; font-weight: 500; background: var(--cream); }
.cat-name { font-weight: 500; color: var(--ink); }

.rate-grid.comp { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 760px) { .rate-grid.comp { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .rate-grid.comp { grid-template-columns: 1fr; } }
.rate-card.comp { border-left-color: var(--error); padding: 14px 16px; }
.rate-card.comp .rate-value { color: var(--error); font-size: 26px; }
.rate-card.comp .rate-def { margin-bottom: 8px; }
.trend-note {
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: 8px;
  font-family: 'JetBrains Mono', monospace;
}

/* ========== ★ 01+ 里程碑累計 ========== */
.ms-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-left: 4px solid var(--success);
  border-radius: 3px;
  padding: 14px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.ms-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
@media (max-width: 900px) { .ms-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .ms-grid { grid-template-columns: 1fr; } }
.ms-tile {
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent, var(--teal));
  border-radius: 3px;
  padding: 14px 16px 12px;
  background: var(--cream);
}
.ms-tile[data-accent="green"] { --accent: var(--success); }
.ms-tile[data-accent="teal"]  { --accent: var(--teal); }
.ms-tile[data-accent="gold"]  { --accent: var(--gold); }
.ms-tile[data-accent="plum"]  { --accent: var(--plum); }
.ms-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.ms-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 600;
  line-height: 1.1;
  color: var(--ink);
}
.ms-value .ms-unit { font-size: 14px; font-weight: 400; color: var(--ink-faint); margin-left: 4px; }
.ms-split {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: var(--ink-soft);
  margin-top: 6px;
}
.ms-def { font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 6px; }
.ms-note { font-size: 12px; color: var(--warn); }

/* ========== ★ 06+ 沖積圖 / 樹狀圖 ========== */
.flow-card { margin-bottom: 14px; }
.flow-card .chart-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.flow-card .chart-sub { font-size: 11px; color: var(--ink-faint); font-weight: 400; }
.flow-scroll { overflow-x: auto; }
.flow-scroll .echart { min-width: 640px; }
.echart { width: 100%; }
.chart-note { font-size: 11px; color: var(--ink-faint); margin-top: 8px; font-style: italic; }

/* Satisfaction placeholder */
.placeholder-card {
  background: var(--paper);
  border: 1px dashed var(--border-strong);
  border-radius: 3px;
  padding: 28px 24px;
  text-align: center;
}
.placeholder-card .ph-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 16px;
  color: var(--ink-soft);
  margin-bottom: 6px;
}
.placeholder-card .ph-desc {
  font-size: 13px;
  color: var(--ink-faint);
}

/* ========== Year tabs (historical section) ========== */
.year-tab-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 12px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.year-tab {
  padding: 5px 14px;
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink-soft);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.year-tab:hover {
  border-color: var(--gold);
  color: var(--gold);
}
.year-tab.active {
  background: var(--gold);
  border-color: var(--gold);
  color: white;
  font-weight: 500;
}
.year-tab .yc {
  font-size: 10px;
  opacity: 0.85;
  margin-left: 4px;
}

/* ========== Historical Baseline ========== */
.hist-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-left: 4px solid var(--gold);
  border-radius: 3px;
  padding: 20px 22px;
}
.hist-band {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.hist-band .total-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 600;
  color: var(--gold);
  line-height: 1;
}
.hist-band .total-label {
  font-size: 13px;

    _charts.pChart.setOption({ grid: { left: 44, right: 20, top: 34, bottom: 30 }, tooltip: { trigger: 'axis', formatter: ps => { const i = ps[0].dataIndex; return `${qs[i].q}：${pctS[i] == null ? '樣本不足' : pctS[i] + '%'}（n=${qs[i].n}）<br>中心線 ${clS[i]}%`; } },
      legend: { top: 0, left: 50, textStyle: { ...font, fontSize: 11 }, data: [labels[_t.prop], '中心線', '管制界限'] },
      xAxis: { type: 'category', data: qs.map(q => q.q.replace(/^20/, '')), axisLabel: { ...font, fontSize: 10 } }, yAxis: { type: 'value', min: 0, max: 100, axisLabel: { ...font, fontSize: 11, formatter: '{value}%' }, splitLine: { lineStyle: { color: '#EEE8DC' } } },
      series: [
        { name: labels[_t.prop], type: 'line', data: pctS, connectNulls: true, symbolSize: 7, lineStyle: { color: '#1F5A5A', width: 2 }, itemStyle: { color: '#1F5A5A' }, label: { ...font, show: true, fontSize: 10, color: '#5C5C5C', formatter: p => p.value == null ? '' : p.value + '%' },
          markLine: bi > 0 ? { silent: true, symbol: 'none', lineStyle: { type: 'dashed', color: '#8A8580' }, label: { ...font, fontSize: 11, color: '#5C5C5C', formatter: 'ERAS 啟動', position: 'insideEndTop' }, data: [{ xAxis: bi - 0.5 }] } : undefined },
        { name: '中心線', type: 'line', data: clS, step: 'middle', showSymbol: false, lineStyle: { color: '#B85450', width: 1.5 } },
        { name: '管制界限', type: 'line', data: qs.map(q => lim(q, 1)), step: 'middle', showSymbol: false, lineStyle: { color: '#A87B4D', type: 'dashed', width: 1 } },
        { name: '管制界限', type: 'line', data: qs.map(q => lim(q, -1)), step: 'middle', showSymbol: false, lineStyle: { color: '#A87B4D', type: 'dashed', width: 1 } },
      ] });
    $('pNote').textContent = `背景期中心線 ${cl.A == null ? '—' : Math.round(cl.A * 1000) / 10 + '%（' + sp.pool.A.k + '/' + sp.pool.A.n + '）'} → ERAS 期 ${cl.B == null ? '—' : Math.round(cl.B * 1000) / 10 + '%（' + sp.pool.B.k + '/' + sp.pool.B.n + '）'}。樣本少於 ${_d.minN} 的季度不標數值。`;
  } else if ($('pChart')) { $('pChart').innerHTML = '<div class="plist-empty">尚無足夠資料</div>'; }
  // C. CUSUM
  const cu = g.cusum[isStent ? 'notube' : 'or'];
  if ($('cusumChart') && cu && cu.n) {
    const ser = cu.series[String(_t.target)] || [];
    _charts.cusumChart = echarts.init($('cusumChart'), null, { renderer: 'svg' });
    _charts.cusumChart.setOption({ grid: { left: 44, right: 20, top: 20, bottom: 34 }, tooltip: { trigger: 'axis', formatter: ps => `第 ${ps[0].dataIndex + 1} 例：CUSUM ${ps[0].value}` },
      xAxis: { type: 'category', data: ser.map((_, i) => i + 1), axisLabel: { ...font, fontSize: 10, interval: Math.max(0, Math.floor(ser.length / 12)) }, name: '病人序（依手術日）', nameLocation: 'middle', nameGap: 22, nameTextStyle: { ...font, fontSize: 11 } },
      yAxis: { type: 'value', axisLabel: { ...font, fontSize: 11 }, splitLine: { lineStyle: { color: '#EEE8DC' } } },
      series: [{ type: 'line', data: ser, showSymbol: false, lineStyle: { color: '#2C4866', width: 2 }, areaStyle: { color: 'rgba(44,72,102,0.08)' },
        markLine: { silent: true, symbol: 'none', lineStyle: { type: 'dashed', color: '#8A8580' }, label: { ...font, fontSize: 11, color: '#5C5C5C', formatter: p => p.name, position: 'insideEndTop' }, data: [{ yAxis: 0, name: '' }].concat(cu.firstB > 0 ? [{ xAxis: cu.firstB, name: 'ERAS 啟動' }] : []) } }] });
    $('cusumNote').textContent = `共 ${cu.n} 例，成功 ${cu.success} 例（${Math.round(cu.success / cu.n * 1000) / 10}%）；目標 ${Math.round(_t.target * 100)}%。曲線斜率 > 0 表示該段成功率高於目標。`;
  } else if ($('cusumChart')) { $('cusumChart').innerHTML = '<div class="plist-empty">尚無足夠資料</div>'; }
}
window.addEventListener('resize', () => Object.values(_charts).forEach(c => { try { c.resize(); } catch (e) {} }));
load();
</script>
</body>
</html>
