<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>儀表板 — 心臟外科手術病人管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #FAF7F2;
  --paper: #FFFFFF;
  --ink: #1A1A1A;
  --ink-soft: #5C5C5C;
  --ink-faint: #8A8580;
  --teal: #1F5A5A;
  --teal-tint: #F5F9F9;
  --teal-soft: #E6EDED;
  --gold: #A87B4D;
  --plum: #6B5876;
  --plum-tint: #F2EFF4;
  --navy: #2C4866;
  --navy-tint: #EEF2F7;
  --border: #E8E2D5;
  --border-strong: #D4CDB8;
  --success: #4A7A5A;
  --success-bg: #EDF3EE;
  --warn: #B8842D;
  --warn-bg: #FBF3DE;
  --error: #B85450;
  --error-bg: #FBEFEE;
}

body {
  font-family: 'Noto Sans TC', system-ui, sans-serif;
  background: var(--cream);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.6;
  padding: 20px 16px 60px;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1080px; margin: 0 auto; }

/* ========== Header ========== */
header {
  margin: 16px 0 24px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.brand .eyebrow {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 6px;
}
.brand h1 {
  font-family: 'Noto Serif TC', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--ink);
}
.role-tag {
  background: var(--navy);
  color: white;
  padding: 4px 12px;
  border-radius: 3px;
  font-size: 12px;
  letter-spacing: 0.1em;
  font-weight: 500;
}
.as-of {
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: 4px;
}

/* ========== Key Bar ========== */
.key-bar {
  background: var(--navy-tint);
  border: 1px solid #DCE3EB;
  border-radius: 3px;
  padding: 12px 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.key-bar label { font-size: 13px; color: var(--navy); font-weight: 500; }
.key-bar input {
  flex: 1;
  min-width: 180px;
  padding: 7px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: white;
}
.key-bar input:focus {
  outline: none;
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(44, 72, 102, 0.12);
}
.btn-refresh {
  padding: 7px 14px;
  background: var(--paper);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
  font-family: inherit;
}
.btn-refresh:hover { border-color: var(--navy); color: var(--navy); }

/* ========== Section title ========== */
.section-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 17px;
  color: var(--ink);
  font-weight: 600;
  margin: 30px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.section-title .num {
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 0.1em;
}
.section-title .sub {
  font-size: 12px;
  color: var(--ink-faint);
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 400;
  margin-left: auto;
}

/* ========== Overview cards ========== */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
@media (max-width: 760px) { .overview-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 400px) { .overview-grid { grid-template-columns: 1fr; } }

.ov-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent);
  border-radius: 3px;
  padding: 16px 18px;
}
.ov-card[data-accent="teal"]  { --accent: var(--teal); }
.ov-card[data-accent="gold"]  { --accent: var(--gold); }
.ov-card[data-accent="plum"]  { --accent: var(--plum); }
.ov-card[data-accent="navy"]  { --accent: var(--navy); }
.ov-label {
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  font-weight: 500;
}
.ov-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.1;
}
.ov-value.placeholder { color: var(--ink-faint); font-size: 24px; }
.ov-unit {
  font-size: 12px;
  color: var(--ink-faint);
  margin-left: 4px;
}

/* ========== Tabs ========== */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 0;
  border-bottom: 1px solid var(--border);
}
.tab {
  padding: 9px 16px;
  font-family: inherit;
  font-size: 14px;
  border: 1px solid transparent;
  border-bottom: none;
  background: transparent;
  cursor: pointer;
  color: var(--ink-soft);
  font-weight: 500;
  margin-bottom: -1px;
  transition: all 0.15s;
}
.tab:hover { color: var(--ink); }
.tab.active {
  background: var(--paper);
  border-color: var(--border);
  color: var(--navy);
  font-weight: 600;
}
.tab .count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-faint);
  margin-left: 4px;
}
.tab.active .count { color: var(--navy); }

.tab-content {
  background: var(--paper);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 3px 3px;
  min-height: 100px;
}

/* ========== Patient list ========== */
.plist {
  list-style: none;
}
.plist-row {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1.2fr 0.8fr;
  gap: 12px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  align-items: center;
}
.plist-row:last-child { border-bottom: none; }
.plist-row:hover { background: var(--cream); }
.plist-row.header {
  font-size: 12px;
  color: var(--ink-faint);
  font-weight: 500;
  letter-spacing: 0.05em;
  background: var(--cream);
  border-bottom: 1px solid var(--border-strong);
}
.plist-row .name { font-weight: 500; }
.plist-row .meta { color: var(--ink-soft); font-size: 13px; }
.plist-row .date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink);
}
.plist-row .surgery { color: var(--gold); font-weight: 500; font-size: 13px; }
.plist-empty {
  padding: 28px;
  text-align: center;
  color: var(--ink-faint);
  font-style: italic;
  font-size: 13px;
}
.status-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
}
.status-pill.scheduled { background: var(--warn-bg); color: var(--warn); }
.status-pill.completed { background: var(--success-bg); color: var(--success); }
.status-pill.cancelled { background: #F0EEEA; color: var(--ink-faint); }
.status-pill.reschedule { background: var(--plum-tint); color: var(--plum); }
@media (max-width: 600px) {
  .plist-row { grid-template-columns: 1fr; gap: 4px; padding: 12px 16px; }
  .plist-row.header { display: none; }
}

/* ========== Metric stat cards ========== */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
@media (max-width: 760px) { .metric-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .metric-grid { grid-template-columns: 1fr; } }

.mc {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.mc-label {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.4;
}
.mc-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 600;
  color: var(--ink);
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.mc-value.muted { color: var(--ink-faint); font-size: 16px; font-weight: 500; }
.mc-value .unit { font-size: 13px; color: var(--ink-faint); font-weight: 400; }
.mc-meta {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 2px;
}
.mc.pending { background: #FAF7EE; border-style: dashed; }
.mc.pending .mc-meta { color: var(--warn); font-style: italic; }

/* Rates */
.rate-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (max-width: 600px) { .rate-grid { grid-template-columns: 1fr; } }
.rate-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-left: 4px solid var(--plum);
  border-radius: 3px;
  padding: 18px 20px;
}
.rate-label {
  font-size: 14px;
  color: var(--ink);
  font-weight: 500;
  margin-bottom: 4px;
}
.rate-def {
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 12px;
  font-style: italic;
}
.rate-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 600;
  color: var(--plum);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.rate-value .unit { font-size: 14px; font-weight: 400; color: var(--ink-soft); }
.rate-frac {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 4px;
}
.rate-value.muted { color: var(--ink-faint); font-size: 18px; }

/* ========== ERAS / 非ERAS 兩組並列對照 ========== */
.group-legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--ink-soft);
}
.group-legend .gl-item { display: inline-flex; align-items: center; gap: 6px; }
.group-legend .gl-dot {
  width: 10px; height: 10px; border-radius: 3px; display: inline-block;
}
.group-legend .gl-dot.eras { background: var(--teal); }
.group-legend .gl-dot.non  { background: var(--gold); }

/* metric card 內兩欄 */
.mc-compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 6px;
}
.mc-col {
  border-left: 3px solid var(--gc);
  padding-left: 9px;
}
.mc-col.eras { --gc: var(--teal); }
.mc-col.non  { --gc: var(--gold); }
.mc-col .mc-col-tag {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--gc);
  margin-bottom: 3px;
}
.mc-col .mc-value { font-size: 20px; }
.mc-col .mc-value .unit { font-size: 11px; }

/* rate card 內兩欄 */
.rate-compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 4px;
}
.rate-col {
  border-left: 3px solid var(--gc);
  padding-left: 11px;
}
.rate-col.eras { --gc: var(--teal); }
.rate-col.non  { --gc: var(--gold); }
.rate-col .tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--gc);
  margin-bottom: 4px;
}
.rate-col .rate-value { color: var(--gc); font-size: 26px; }
.rate-col .rate-value.muted { color: var(--ink-faint); font-size: 18px; }
@media (max-width: 400px) {
  .rate-compare { grid-template-columns: 1fr; gap: 10px; }
}

/* ========== ★2026-09 篩選列 / 類別總覽 / 統計卡 ========== */
.filter-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-left: 4px solid var(--teal);
  border-radius: 3px;
  padding: 14px 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.filter-row { display: flex; flex-direction: column; gap: 6px; }
.filter-row.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.filter-row.two > div { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 560px) { .filter-row.two { grid-template-columns: 1fr; } }
.filter-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 4px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink-soft);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}
.chip:hover { border-color: var(--teal); color: var(--teal); }
.chip.active { background: var(--teal); border-color: var(--teal); color: white; font-weight: 500; }
.chip .chip-n {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  opacity: 0.8;
}
.filter-summary {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  font-size: 13px;
  color: var(--ink-soft);
}
.filter-summary strong { color: var(--ink); font-weight: 600; }
.small-n {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 10px;
  background: var(--warn-bg);
  color: var(--warn);
  font-size: 10px;
  font-weight: 600;
  vertical-align: middle;
  letter-spacing: 0.04em;
}
.stat-legend {
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 10px;
  font-style: italic;
}
.mc-stats {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
}
.mc-stats strong { color: var(--ink); font-weight: 600; }
.mc-stats .u { font-size: 10px; color: var(--ink-faint); margin-left: 1px; }

.cat-table-wrap {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow-x: auto;
}
.cat-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 700px;
}
.cat-table th, .cat-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
}
.cat-table th {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  background: var(--cream);
}
.cat-table th.num, .cat-table td.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
.cat-table td.num .u { font-size: 10px; color: var(--ink-faint); margin-left: 2px; }
.cat-table td.num .frac { display: block; font-size: 10px; color: var(--ink-faint); }
.cat-table td .muted { color: var(--ink-faint); }
.cat-table td .warn { color: var(--error); font-weight: 600; }
.cat-table .cat-row[data-cat] { cursor: pointer; }
.cat-table .cat-row[data-cat]:hover { background: var(--teal-tint); }
.cat-table .cat-row.selected { background: var(--teal-soft); }
.cat-table .cat-row.selected .cat-name { color: var(--teal); font-weight: 600; }
.cat-table .cat-row.total td { border-top: 2px solid var(--border-strong); border-bottom: none; font-weight: 500; background: var(--cream); }
.cat-name { font-weight: 500; color: var(--ink); }

.rate-grid.comp { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 760px) { .rate-grid.comp { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .rate-grid.comp { grid-template-columns: 1fr; } }
.rate-card.comp { border-left-color: var(--error); padding: 14px 16px; }
.rate-card.comp .rate-value { color: var(--error); font-size: 26px; }
.rate-card.comp .rate-def { margin-bottom: 8px; }
.trend-note {
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: 8px;
  font-family: 'JetBrains Mono', monospace;
}

/* ========== ★ 01+ 里程碑累計 ========== */
.ms-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-left: 4px solid var(--success);
  border-radius: 3px;
  padding: 14px 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.ms-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
@media (max-width: 900px) { .ms-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .ms-grid { grid-template-columns: 1fr; } }
.ms-tile {
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent, var(--teal));
  border-radius: 3px;
  padding: 14px 16px 12px;
  background: var(--cream);
}
.ms-tile[data-accent="green"] { --accent: var(--success); }
.ms-tile[data-accent="teal"]  { --accent: var(--teal); }
.ms-tile[data-accent="gold"]  { --accent: var(--gold); }
.ms-tile[data-accent="plum"]  { --accent: var(--plum); }
.ms-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.ms-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 600;
  line-height: 1.1;
  color: var(--ink);
}
.ms-value .ms-unit { font-size: 14px; font-weight: 400; color: var(--ink-faint); margin-left: 4px; }
.ms-split {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: var(--ink-soft);
  margin-top: 6px;
}
.ms-def { font-size: 11px; color: var(--ink-faint); font-style: italic; margin-top: 6px; }
.ms-note { font-size: 12px; color: var(--warn); }

/* ========== ★ 06+ 沖積圖 / 樹狀圖 ========== */
.flow-card { margin-bottom: 14px; }
.flow-card .chart-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.flow-card .chart-sub { font-size: 11px; color: var(--ink-faint); font-weight: 400; }
.flow-scroll { overflow-x: auto; }
.flow-scroll .echart { min-width: 640px; }
.echart { width: 100%; }
.chart-note { font-size: 11px; color: var(--ink-faint); margin-top: 8px; font-style: italic; }

/* Satisfaction placeholder */
.placeholder-card {
  background: var(--paper);
  border: 1px dashed var(--border-strong);
  border-radius: 3px;
  padding: 28px 24px;
  text-align: center;
}
.placeholder-card .ph-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 16px;
  color: var(--ink-soft);
  margin-bottom: 6px;
}
.placeholder-card .ph-desc {
  font-size: 13px;
  color: var(--ink-faint);
}

/* ========== Year tabs (historical section) ========== */
.year-tab-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 12px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.year-tab {
  padding: 5px 14px;
  border: 1px solid var(--border-strong);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink-soft);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.year-tab:hover {
  border-color: var(--gold);
  color: var(--gold);
}
.year-tab.active {
  background: var(--gold);
  border-color: var(--gold);
  color: white;
  font-weight: 500;
}
.year-tab .yc {
  font-size: 10px;
  opacity: 0.85;
  margin-left: 4px;
}

/* ========== Historical Baseline ========== */
.hist-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-left: 4px solid var(--gold);
  border-radius: 3px;
  padding: 20px 22px;
}
.hist-band {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.hist-band .total-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 600;
  color: var(--gold);
  line-height: 1;
}
.hist-band .total-label {
  font-size: 13px;
  color: var(--ink-soft);

<body>
<div class="container">

  <header>
    <div class="brand">
      <div class="eyebrow">Dashboard</div>
      <h1>儀表板</h1>
      <div class="as-of" id="asOf"></div>
    </div>
    <span class="role-tag">管理</span>
  </header>

  <div class="key-bar">
    <label for="doctor_key">通行碼</label>
    <input type="password" id="doctor_key" placeholder="輸入後載入資料" autocomplete="off">
    <button type="button" class="btn-refresh" id="refreshBtn">↻ 重新載入</button>
  </div>

  <div class="alert alert-error" id="errAlert"></div>

  <div id="content">
    <div class="loading-block"><span class="loading"></span> 載入中…</div>
  </div>

  <footer>心臟外科手術病人管理系統 · 儀表板 v2.0 · 依手術類別／季度</footer>
</div>

<!-- ECharts 5.5.1：自帶於 repo（echarts.min.js），避免院內網路擋 CDN；載入失敗才退回 jsDelivr -->
<script src="echarts.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js';document.head.appendChild(s);"></script>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzr5eDnHyyq2hWZJ1pD4x5z7h8LkabeZMNDcl6o1lWx0e3bE4CLDCkmqYCzPA1qagU2ug/exec';

const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// ===== Key persistence =====
if (window.location.hash.startsWith('#k=')) {
  $('doctor_key').value = decodeURIComponent(window.location.hash.slice(3));
}
$('doctor_key').addEventListener('change', () => {
  const v = $('doctor_key').value;
  if (v) {
    history.replaceState(null, '', '#k=' + encodeURIComponent(v));
    load();
  }
});

// ===== JSONP =====
function jsonp(url, params, timeoutMs = 35000) {
  return new Promise((resolve, reject) => {
    const cb = '_dash_cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const usp = new URLSearchParams({ ...params, callback: cb });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('查詢逾時')); }, timeoutMs);
    function cleanup() { delete window[cb]; script.remove(); clearTimeout(timer); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('網路錯誤')); };
    script.src = url + '?' + usp.toString();
    document.body.appendChild(script);
  });
}

// ===== Load =====
// fresh=true 時強制後端略過快取取最新（「重新載入」按鈕用）；一般載入吃 300 秒快取，較快
async function load(fresh) {
  const key = $('doctor_key').value.trim();
  $('errAlert').classList.remove('show');

  if (!key) {
    $('content').innerHTML = '<div class="loading-block">請先輸入通行碼以載入資料</div>';
    return;
  }

  $('content').innerHTML = '<div class="loading-block"><span class="loading"></span> 載入中…</div>';

  try {
    const params = { action: 'dashboard', key };
    if (fresh) params.fresh = '1';
    const res = await jsonp(APPS_SCRIPT_URL, params);
    if (res.error === 'unauthorized') {
      showError('通行碼錯誤');
      $('content').innerHTML = '';
      return;
    }
    if (res.error) {
      showError('載入失敗：' + res.error);
      $('content').innerHTML = '';
      return;
    }
    render(res);

    // 衛教瀏覽量 — 副載入(主 dashboard 載入完成後再請求,不阻塞主視圖)
    loadEduStats(key).catch(err => {
      console.warn('衛教瀏覽量載入失敗:', err);
      // 副載入失敗不顯示錯誤橫幅,只在 console 警告
    });
  } catch (err) {
    showError('載入失敗:' + err.message);
    $('content').innerHTML = '';
  }
}

// ===== 副載入:衛教瀏覽量 =====
async function loadEduStats(key) {
  // 在 content 末尾加上 loading 區塊
  const loadingId = '_edu_loading_' + Date.now();
  $('content').insertAdjacentHTML('beforeend',
    `<div id="${loadingId}" class="loading-block" style="margin-top:20px"><span class="loading"></span> 載入衛教瀏覽量…</div>`
  );

  try {
    const res = await jsonp(APPS_SCRIPT_URL, { action: 'eduStats', key });
    document.getElementById(loadingId)?.remove();

    if (res.error === 'unauthorized') return;
    if (res.error) {
      $('content').insertAdjacentHTML('beforeend',
        `<div class="edu-empty-card"><div class="eec-title">衛教瀏覽量載入失敗</div><div class="eec-desc">${escapeHtml(res.error)}</div></div>`
      );
      return;
    }
    $('content').insertAdjacentHTML('beforeend', renderEduStats(res));
  } catch (err) {
    document.getElementById(loadingId)?.remove();
    console.warn('eduStats 請求失敗:', err);
  }
}

function showError(msg) {
  const el = $('errAlert');
  el.textContent = msg;
  el.classList.add('show');
}

$('refreshBtn').addEventListener('click', () => load(true));  // 重新載入 = 強制取最新（略過快取）

// ===== Render =====
function render(d) {
  $('asOf').textContent = d.asOf ? '資料時間：' + d.asOf : '';

  const html = [];
  const h = d.historical || null;
  const ov = d.overview;

  // ===== 01 總覽 =====
  const split = (h && ov.currentSystemVolume != null)
    ? `<div class="ov-split"><span>歷史 ${h.overall ? h.overall.totalPatients : ov.historicalVolume}</span><span>本系統 ${ov.currentSystemVolume}</span></div>`
    : '';
  html.push(`
    <h2 class="section-title">
      <span class="num">01</span>
      <span>總覽</span>
    </h2>
    <div class="overview-grid">
      <div class="ov-card" data-accent="teal">
        <div class="ov-label">累積服務量</div>
        <div class="ov-value">${ov.totalServiceVolume}<span class="ov-unit">位</span></div>
        ${split}
      </div>
      ${ovCard('gold', '待開刀', ov.pending, '位')}
      ${ovCard('plum', '進行中', ov.inProgress, '位')}
      ${ovCard('navy', '本月已完成', ov.completedThisMonth, '位')}
    </div>
  `);

  // ===== 01+ 里程碑累計（★2026-09：三大指標達成人數，含歷史背景；可切換術式）=====
  html.push('<div id="milestones"></div>');

  // ===== 02 歷史背景資料 =====
  if (h) html.push(renderHistorical(h));

  // ===== 03 年度趨勢分析 =====
  if (h && h.years && h.years.length >= 2) html.push(renderTrends(h));

  // ===== 04–09 本系統成效（★2026-09：依手術類別 × 季度 × 途徑 × 流程 即時篩選）=====
  // 由 cases[]（去識別逐案紀錄）在前端計算；篩選改變只重畫 #dyn，不重載後端。
  html.push('<div id="dyn"></div>');

  // ===== 10 病患滿意度 =====
  const sat = d.satisfaction;
  if (sat && sat.totalResponses > 0) {
    html.push(renderSatisfaction(sat));
  } else {
    html.push(`
      <h2 class="section-title">
        <span class="num">10</span>
        <span>病患滿意度</span>
      </h2>
      <div class="placeholder-card">
        <div class="ph-title">${sat ? '尚無問卷回覆' : '敬請期待'}</div>
        <div class="ph-desc">問卷上線後，待病人填寫此區會顯示統計結果。</div>
      </div>
    `);
  }

  $('content').innerHTML = html.join('');

  _dashData = d;
  renderMilestones();
  renderDynamic();

  // Year tab binding (historical)
  if (h) bindYearTabs();
}

/* ============================================================
 *  ★ 本系統成效：篩選 + 類別總覽 + 季度趨勢 + 指標明細 + 併發症 + 病人清單
 *  資料來源 d.cases[]：{ d, y, q, cat, mics, surg, eras, ext, water, food, walk, tube, icu, los, major, aki, ... }
 *  設計原則：
 *   - 每格同時給 平均 與 中位數(IQR)、都標 n；n<5 標「樣本少」而不隱藏
 *   - 里程碑指標排除有重大異常事件者（與後端舊邏輯一致）；併發症率則以全部案為分母
 *   - 歷史背景（2020–2026/02）全為 CABG，只在類別=CABG 時當基準並列
 * ============================================================ */
let _dashData = null;
const SMALL_N = 5;
// ★背景基準：全術式背景表（含「術式類別」欄）→ 依類別取；舊表（僅 CABG）→ 只在 CABG 時取
function histFor(h, cat) {
  if (!h || !h.overall) return null;
  if (cat === 'all') return h.overall;
  if (h.byCategory && h.byCategory[cat]) return h.byCategory[cat];
  if (!h.hasCategoryColumn && cat === 'CABG') return h.overall;
  return null;
}
const _f = { cat: 'all', period: 'all', mics: 'all', eras: 'all' };
const CAT_ORDER = ['CABG', 'MICS-CABG', '主動脈手術', '瓣膜', 'CABG+瓣膜', '主動脈支架', '其他'];
const CAT_LABEL = {
  'CABG': '冠狀動脈繞道 CABG（傳統開胸）',
  'MICS-CABG': '微創冠狀動脈繞道 MICS-CABG',
  '瓣膜': '瓣膜手術',
  'CABG+瓣膜': 'CABG＋瓣膜 複合',
  '主動脈手術': '主動脈手術（開放式：TAR／Bentall／升主動脈）',
  '主動脈支架': '主動脈支架置放（EVAR／TEVAR）',
  '其他': '其他',
};

// ---- 統計小工具 ----
const S = {
  nums: (arr) => arr.filter(v => v != null && !isNaN(v)),
  mean: (arr) => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length * 10) / 10 : null,
  quantile: (sorted, p) => {
    if (!sorted.length) return null;
    const pos = (sorted.length - 1) * p, lo = Math.floor(pos), hi = Math.ceil(pos);
    const v = sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
    return Math.round(v * 10) / 10;
  },
  summary(arr) {
    const v = S.nums(arr).slice().sort((a, b) => a - b);
    return { n: v.length, mean: S.mean(v), median: S.quantile(v, 0.5), q1: S.quantile(v, 0.25), q3: S.quantile(v, 0.75) };
  },
  pct: (k, n) => n ? Math.round(k / n * 1000) / 10 : null,
};

// ---- 篩選 ----
function periodOf(c) { return { y: c.y ? String(c.y) : '', q: c.q || '' }; }
function matchPeriod(c, period) {
  if (period === 'all') return true;
  const p = periodOf(c);
  return /Q/.test(period) ? p.q === period : p.y === period;
}
function matchBase(c, f) {   // 不含類別的篩選（類別總覽表要跨類別比較）
  if (!matchPeriod(c, f.period)) return false;
  if (f.mics === 'mics' && !c.mics) return false;
  if (f.mics === 'open' && c.mics) return false;
  if (f.eras === 'eras' && c.eras !== '是') return false;
  if (f.eras === 'non' && c.eras !== '否') return false;
  return true;
}
function matchAll(c, f) { return matchBase(c, f) && (f.cat === 'all' || c.cat === f.cat); }

// ---- 一組案例的指標 ----
function computeGroup(rows) {
  const clean = rows.filter(c => !c.major);   // 里程碑排除重大事件者
  const m = (k) => S.summary(clean.map(c => c[k]));
  const ext = S.nums(clean.map(c => c.ext));
  // ★拔管分級：有小時數者依數值；2025 CPB 回溯案無時間者依備註「拔管 <6h／≥6h」（後端 extClass）
  const known = clean.filter(c => c.extClass);
  const orN = known.filter(c => c.extClass === 'or').length, earlyN = known.filter(c => c.extClass !== 'ge6').length;
  const total = rows.length;
  const cnt = (kw) => rows.filter(c => c.major && c.major.indexOf(kw) >= 0).length;
  const akiN = rows.filter(c => c.aki && c.aki !== '無AKI' && c.aki !== '無' && !/^no/i.test(c.aki)).length;
  const noTubeN = rows.filter(c => c.airway === '不插管 HFNC').length;   // ★不插管麻醉（從頭到尾無氣道裝置）
  const convN = rows.filter(c => c.airway === '不插管→轉插管').length;
  const losKnown = rows.filter(c => c.los != null);                       // ★主動脈支架目標：48 小時內出院
  const dis48N = losKnown.filter(c => c.los <= 2).length;
  const dis24N = losKnown.filter(c => c.los <= 1).length;
  const akiKnown = rows.filter(c => c.aki).length;
  return {
    n: total, nClean: clean.length, nMajor: total - clean.length,
    metrics: {
      extubation: m('ext'), tryWater: m('water'), foodIntake: m('food'), ambulation: m('walk'),
      chestTube: m('tube'), icuStay: m('icu'), hospitalLOS: m('los'),
    },
    rates: {
      extubatedInOR:   { count: orN,    total: known.length, pct: S.pct(orN, known.length) },   // 分母 = 有拔管分級者（ETT/LMA）；不插管者不在內
      earlyExtubation: { count: earlyN, total: known.length, pct: S.pct(earlyN, known.length) },
      noIntubation:    { count: noTubeN, total: total, pct: S.pct(noTubeN, total), conv: convN },   // ★不插管率（分母 = 全部案）
      discharge48h:    { count: dis48N, total: losKnown.length, pct: S.pct(dis48N, losKnown.length) },   // ★住院 ≤2 天（分母 = 有出院日者）
      discharge24h:    { count: dis24N, total: losKnown.length, pct: S.pct(dis24N, losKnown.length) },   // ★住院 ≤1 天
    },
    complications: {
      total,
      cpr:          { count: cnt('術後急救'), total, pct: S.pct(cnt('術後急救'), total) },
      reintubation: { count: cnt('重新插管'), total, pct: S.pct(cnt('重新插管'), total) },
      reoperation:  { count: cnt('再次手術'), total, pct: S.pct(cnt('再次手術'), total) },
      stroke:       { count: cnt('中風'),     total, pct: S.pct(cnt('中風'), total) },
      ecmo:         { count: cnt('術後 ECMO'), total, pct: S.pct(cnt('術後 ECMO'), total) },
      death:        { count: cnt('住院死亡'), total, pct: S.pct(cnt('住院死亡'), total) },
      iabp:         { count: rows.filter(c => c.event && c.event.indexOf('IABP') >= 0).length, total, pct: S.pct(rows.filter(c => c.event && c.event.indexOf('IABP') >= 0).length, total) },   // 一般異常事件：記錄不結案
      aki:          { count: akiN, total: akiKnown, pct: S.pct(akiN, akiKnown) },
    },
  };
}

function periodOptions(cases) {
  const years = [...new Set(cases.map(c => c.y).filter(Boolean))].sort();
  const quarters = [...new Set(cases.map(c => c.q).filter(Boolean))].sort();
  return { years: years.map(String), quarters };
}
function filterLabel(f) {
  const parts = [];
  parts.push(f.cat === 'all' ? '全部類別' : CAT_LABEL[f.cat] || f.cat);
  parts.push(f.period === 'all' ? '全部期間' : f.period);
  if (f.mics !== 'all') parts.push(f.mics === 'mics' ? '微創 MICS' : '傳統開胸');
  if (f.eras !== 'all') parts.push(f.eras === 'eras' ? 'ERAS 流程' : '非 ERAS 流程');
  return parts.join(' · ');
}

// ---- 主渲染 ----
function renderDynamic() {
  const d = _dashData;
  if (!d) return;
  const cases = d.cases || [];
  const h = d.historical || null;
  const html = [];

  // 若期間選項已不存在（例如換了通行碼/資料），退回全部
  const po = periodOptions(cases);
  if (_f.period !== 'all' && !po.years.includes(_f.period) && !po.quarters.includes(_f.period)) _f.period = 'all';

  const base = cases.filter(c => matchBase(c, _f));
  const sel  = cases.filter(c => matchAll(c, _f));
  const g = computeGroup(sel);

  // ===== 04 篩選 =====
  const catCount = (cat) => base.filter(c => cat === 'all' || c.cat === cat).length;
  const chip = (group, val, label, n, active) =>
    `<button type="button" class="chip${active ? ' active' : ''}" data-group="${group}" data-val="${escapeHtml(val)}">${escapeHtml(label)}${n != null ? `<span class="chip-n">${n}</span>` : ''}</button>`;
  const catChips = [chip('cat', 'all', '全部', catCount('all'), _f.cat === 'all')]
    .concat(CAT_ORDER.filter(c => cases.some(x => x.cat === c)).map(c => chip('cat', c, c, catCount(c), _f.cat === c)));
  const perChips = [chip('period', 'all', '全部', null, _f.period === 'all')]
    .concat(po.years.map(y => chip('period', y, y + ' 全年', null, _f.period === y)))
    .concat(po.quarters.map(q => chip('period', q, q, null, _f.period === q)));
  const micsChips = [['all', '全部'], ['mics', '微創 MICS'], ['open', '傳統開胸']].map(([v, l]) => chip('mics', v, l, null, _f.mics === v));
  const erasChips = [['all', '全部'], ['eras', 'ERAS'], ['non', '非 ERAS']].map(([v, l]) => chip('eras', v, l, null, _f.eras === v));
  const unclassified = cases.filter(c => c.eras !== '是' && c.eras !== '否').length;

  html.push(`
    <h2 class="section-title">
      <span class="num">04</span>
      <span>本系統成效 · 篩選條件</span>
      <span class="sub">${cases.length} 筆術後紀錄${unclassified ? ` · ${unclassified} 筆未標記流程` : ''}</span>
    </h2>
    <div class="filter-card">
      <div class="filter-row"><div class="filter-label">手術類別</div><div class="chip-row">${catChips.join('')}</div></div>
      <div class="filter-row"><div class="filter-label">期間（實際手術日）</div><div class="chip-row">${perChips.join('')}</div></div>
      <div class="filter-row two">
        <div><div class="filter-label">術式途徑</div><div class="chip-row">${micsChips.join('')}</div></div>
        <div><div class="filter-label">流程</div><div class="chip-row">${erasChips.join('')}</div></div>
      </div>
      <div class="filter-summary">目前條件：<strong>${escapeHtml(filterLabel(_f))}</strong> · n = <strong>${g.n}</strong>${g.nMajor ? `（含 ${g.nMajor} 例重大異常事件，里程碑不計入）` : ''}${g.n && g.n < SMALL_N ? smallN() : ''}</div>
    </div>
  `);

  // ===== 05 手術類別總覽 =====
  html.push(renderCategoryTable(base, cases));

  // ===== 06 季度趨勢 =====
  html.push(renderQuarterTrend(cases.filter(c => matchAll(c, { ..._f, period: 'all' })), po.quarters));

  // ===== 06+ 病人流向（沖積圖）＋ 案量組成（樹狀圖）（★2026-09-11，ECharts）=====
  html.push(renderFlowSection(sel));

  // ===== 06++ 趨勢與改善（★2026-09-12：逐案時序圖 + SPC p-chart + CUSUM）=====
  html.push(renderTrendSection());

  // ===== 07 指標明細 =====
  const mm = g.metrics;
  const isStent = (_f.cat === '主動脈支架');
  if (isStent) {
    // ★主動脈支架：發展不插管麻醉、目標 48 小時內出院 → 不看拔管時間，只看 不插管率 / 48h 出院率 / 住院天數
    const cp2 = g.complications;
    const hs = histFor(h, '主動脈支架');
    html.push(`
      <h2 class="section-title">
        <span class="num">07</span>
        <span>主動脈支架 · 恢復指標</span>
        <span class="sub">${escapeHtml(filterLabel(_f))} · n=${g.n}</span>
      </h2>
      <div class="stat-legend">主動脈支架以「不插管麻醉」與「24／48 小時內出院」為目標指標，不採用拔管時間指標；住院天數 = 出院日 − 手術日</div>
      <div class="rate-grid comp">
        ${rateCardS('不插管麻醉比例', '氣道方式 = 不插管 HFNC（全程無氣道裝置）；分母 = 全部案' + (g.rates.noIntubation.conv ? `；另 ${g.rates.noIntubation.conv} 例術中轉插管` : ''), g.rates.noIntubation, hs && hs.stent ? { pct: hs.stent.noTubePct, count: hs.stent.noTube, total: hs.totalPatients, label: '背景基準（≤2025/04/15）' + hs.totalPatients + ' 例' } : null)}
        ${rateCardS('24 小時內出院比例', '住院天數 ≤ 1 天（出院日 − 手術日）；分母 = 已有出院日者', g.rates.discharge24h, hs && hs.stent && hs.stent.dis24Pct != null ? { pct: hs.stent.dis24Pct, count: hs.stent.dis24, total: hs.stent.losN, label: '背景基準' } : null)}
        ${rateCardS('48 小時內出院比例', '住院天數 ≤ 2 天；分母 = 已有出院日者', g.rates.discharge48h, hs && hs.stent && hs.stent.dis48Pct != null ? { pct: hs.stent.dis48Pct, count: hs.stent.dis48, total: hs.stent.losN, label: '背景基準' } : null)}
      </div>
      <div class="metric-grid" style="margin-top:12px">
        ${metricCardS('住院天數', mm.hospitalLOS, '天')}
        ${metricCardS('ICU 滯留時間（有進 ICU 者）', mm.icuStay, '小時')}
        ${metricCardS('術後首次下床走路', mm.ambulation, '小時')}
      </div>
      <h2 class="section-title">
        <span class="num">08</span>
        <span>重大併發症</span>
        <span class="sub">${escapeHtml(filterLabel(_f))}</span>
      </h2>
      <div class="rate-grid comp">
        ${rateCardS('術後急救 (CPR)', '重大異常事件記錄', cp2.cpr, null, true)}
        ${rateCardS('重新插管／插管', '重大異常事件記錄', cp2.reintubation, null, true)}
        ${rateCardS('再次手術', '重大異常事件記錄', cp2.reoperation, null, true)}
        ${rateCardS('中風', '重大異常事件記錄', cp2.stroke, null, true)}
        ${rateCardS('急性腎損傷 AKI', 'KDIGO 判讀 ≠ 無AKI；分母 = 有判讀者', cp2.aki, null, true)}
        ${rateCardS('術後 ECMO', '重大異常事件記錄', cp2.ecmo, null, true)}
        ${rateCardS('住院死亡', '重大異常事件記錄', cp2.death, null, true)}
      ${rateCardS('術後 IABP', '一般異常事件記錄（記錄、不結案、不排除里程碑）', cp2.iabp, null, true)}
      </div>
    `);
  } else {
  html.push(`
    <h2 class="section-title">
      <span class="num">07</span>
      <span>恢復里程碑 · 原始數值</span>
      <span class="sub">${escapeHtml(filterLabel(_f))} · 有效 n=${g.nClean}</span>
    </h2>
    <div class="stat-legend">平均值 ／ 中位數（IQR 四分位距）· 小時自轉入加護病房起算，負值 = 手術室內已完成</div>
    <div class="metric-grid">
      ${metricCardS('術後脫離呼吸器時間', mm.extubation, '小時')}
      ${metricCardS('術後首次 Try Water 時間', mm.tryWater, '小時')}
      ${metricCardS('術後首次固體食物進食時間', mm.foodIntake, '小時')}
      ${metricCardS('術後首次下床走路', mm.ambulation, '小時')}
      ${metricCardS('術後胸管全拔時間', mm.chestTube, '小時')}
      ${metricCardS('ICU 滯留時間', mm.icuStay, '小時')}
      ${metricCardS('住院天數', mm.hospitalLOS, '天')}
    </div>
  `);

  // ===== 08 指標率 + 併發症 =====
  let histOR = null, histEarly = null;
  const o = histFor(h, _f.cat);
  const showHist = !!o;
  if (showHist) {
    const extKnown = o.extubationTiming.inOR + o.extubationTiming.early + o.extubationTiming.late;
    const lbl = '背景基準（≤2025/04/15' + (_f.cat === 'all' ? '，全術式' : '') + '）' + o.totalPatients + ' 例';
    histOR = { pct: o.rates.orExtubationPct, count: o.extubationTiming.inOR, total: extKnown, label: lbl };
    histEarly = { pct: o.rates.earlyExtubationPct, count: o.extubationTiming.inOR + o.extubationTiming.early, total: extKnown, label: lbl };
  }
  const cp = g.complications;
  html.push(`
    <h2 class="section-title">
      <span class="num">08</span>
      <span>拔管指標率與重大併發症</span>
      <span class="sub">${escapeHtml(filterLabel(_f))}${h && !showHist ? ' · 背景表無此類別，無基準並列' : ''}</span>
    </h2>
    <div class="rate-grid">
      ${rateCardS('手術室中拔管比例', '拔管時間 &lt; 轉入加護病房時間', g.rates.extubatedInOR, histOR)}
      ${rateCardS('術後立即拔管比例', '術後脫離呼吸器時間 &lt; 6 小時（含手術室中拔管）', g.rates.earlyExtubation, histEarly)}
      ${(g.rates.noIntubation.count || _f.cat === '主動脈支架') ? rateCardS('不插管麻醉比例', '氣道方式 = 不插管 HFNC（全程無氣道裝置）；分母 = 全部案' + (g.rates.noIntubation.conv ? `；另 ${g.rates.noIntubation.conv} 例術中轉插管` : ''), g.rates.noIntubation, null) : ''}
    </div>
    <div class="rate-grid comp" style="margin-top:12px">
      ${rateCardS('術後急救 (CPR)', '重大異常事件記錄', cp.cpr, null, true)}

      ${rateCardS('再次手術', '重大異常事件記錄', cp.reoperation, null, true)}
      ${rateCardS('中風', '重大異常事件記錄', cp.stroke, null, true)}
      ${rateCardS('急性腎損傷 AKI', 'KDIGO 判讀 ≠ 無AKI；分母 = 有判讀者', cp.aki, null, true)}
      ${rateCardS('術後 ECMO', '重大異常事件記錄', cp.ecmo, null, true)}
      ${rateCardS('住院死亡', '重大異常事件記錄', cp.death, null, true)}
      ${rateCardS('術後 IABP', '一般異常事件記錄（記錄、不結案、不排除里程碑）', cp.iabp, null, true)}
    </div>
  `);
  }   // end if (!isStent)

  // ===== 09 病人清單（套用類別 + 期間篩選）=====
  const lists = d.lists;
  const catOf = (p) => _f.cat === 'all' || p.cat === _f.cat;
  const micsOf = (p) => _f.mics === 'all' || (_f.mics === 'mics' ? p.mics : !p.mics);
  const perOf = (p) => _f.period === 'all' || matchPeriod(caseLikeFromDate(p.actualDate), _f.period);
  const L = {
    pending:    lists.pending.filter(p => catOf(p) && micsOf(p)),
    inProgress: lists.inProgress.filter(p => catOf(p) && micsOf(p) && perOf(p)),
    closed:     lists.closed.filter(p => catOf(p) && micsOf(p) && perOf(p)),
  };
  html.push(`
    <h2 class="section-title">
      <span class="num">09</span>
      <span>病人清單（本系統）</span>
      <span class="sub">${_f.cat !== 'all' || _f.period !== 'all' || _f.mics !== 'all' ? '已套用篩選（待開刀不受期間限制）' : '全部'}</span>
    </h2>
    <div class="tabs" id="tabBar">
      <button type="button" class="tab${_tab === 'pending' ? ' active' : ''}" data-tab="pending">待開刀 <span class="count">${L.pending.length}</span></button>
      <button type="button" class="tab${_tab === 'inProgress' ? ' active' : ''}" data-tab="inProgress">進行中 <span class="count">${L.inProgress.length}</span></button>
      <button type="button" class="tab${_tab === 'closed' ? ' active' : ''}" data-tab="closed">已結案 <span class="count">${L.closed.length}</span></button>
    </div>
    <div class="tab-content">
      <div id="tab-pending" class="tab-panel" style="display:${_tab === 'pending' ? 'block' : 'none'}">${renderList(L.pending, 'pending')}</div>
      <div id="tab-inProgress" class="tab-panel" style="display:${_tab === 'inProgress' ? 'block' : 'none'}">${renderList(L.inProgress, 'inProgress')}</div>
      <div id="tab-closed" class="tab-panel" style="display:${_tab === 'closed' ? 'block' : 'none'}">${renderList(L.closed, 'closed')}</div>
    </div>
  `);

  $('dyn').innerHTML = html.join('');
  bindDynamic();
  drawFlowCharts(sel);
  drawTrendCharts();
}

/* ============================================================
 *  ★ 01+ 里程碑累計：三大指標「達成人數」（本系統 + 歷史背景）

  }

}

function rateCardS(label, defText, r, histRef, isComp) {

    ? `<div class="historical-ref">${escapeHtml(histRef.label || '歷史')}：<span class="hist-val">${histRef.pct}%</span>（${histRef.count} / ${histRef.total}）</div>`

function renderHistorical(h) {
  _historicalCache = h;

}

function buildYearTabs(h) {
  const allYears = ['overall', ...(h.years || [])];
  return allYears.map(y => {
    const summary = getYearSummary(h, y);
    const label = y === 'overall' ? '全部' : y;
    const count = summary ? summary.totalPatients : 0;
    const active = (y === _currentYear) ? ' active' : '';
    return `<button class="year-tab${active}" data-year="${y}">${label}<span class="yc">${count}</span></button>`;
  }).join('');
}

function getYearSummary(h, year) {
  if (year === 'overall') return h.overall;
  return (h.byYear || {})[year] || null;
}

function bindYearTabs() {
  document.querySelectorAll('#yearTabBar .year-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      _currentYear = btn.dataset.year;
      // 更新 active 樣式
      document.querySelectorAll('#yearTabBar .year-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // 重新渲染內容
      const summary = getYearSummary(_historicalCache, _currentYear);
      $('histContent').innerHTML = renderHistContent(summary);
    });
  });
}

// ===== SVG chart helpers =====
function renderLineChart(opts) {
  const W = 480, H = 200;
  const pad = { top: 14, right: 14, bottom: 28, left: 36 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;

  let allY = [];
  opts.series.forEach(s => s.values.forEach(v => {
    if (v != null && !isNaN(v)) allY.push(v);
  }));

  let yMin = opts.yMin != null ? opts.yMin : (allY.length ? Math.min(...allY) : 0);
  let yMax = opts.yMax != null ? opts.yMax : (allY.length ? Math.max(...allY) * 1.15 : 10);
  if (yMax === yMin) yMax = yMin + 1;

  const n = opts.xLabels.length;
  const xPos = (i) => pad.left + (n === 1 ? chartW / 2 : (i / (n - 1)) * chartW);
  const yPos = (v) => pad.top + chartH - ((v - yMin) / (yMax - yMin)) * chartH;

  const fmtVal = (v) => v >= 10 ? Math.round(v) : (Math.round(v * 10) / 10);

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="trend-chart" preserveAspectRatio="xMidYMid meet">`;

  // Grid lines + Y labels (5 horizontal grid lines)
  for (let i = 0; i <= 4; i++) {
    const yc = pad.top + (i / 4) * chartH;
    const v = yMax - (i / 4) * (yMax - yMin);
    svg += `<line x1="${pad.left}" y1="${yc}" x2="${W - pad.right}" y2="${yc}" class="grid"/>`;
    svg += `<text x="${pad.left - 5}" y="${yc + 3}" class="y-label">${fmtVal(v)}</text>`;
  }

  // X axis labels
  opts.xLabels.forEach((label, i) => {
    svg += `<text x="${xPos(i)}" y="${H - pad.bottom + 16}" class="x-label">${label}</text>`;
  });

  // Series
  opts.series.forEach((s) => {
    const pts = s.values.map((v, i) => (v != null && !isNaN(v)) ? { x: xPos(i), y: yPos(v), val: v, label: opts.xLabels[i] } : null);

    // Connected line through non-null points
    const validPts = pts.filter(p => p);
    if (validPts.length >= 2) {
      const poly = validPts.map(p => `${p.x},${p.y}`).join(' ');
      svg += `<polyline points="${poly}" fill="none" stroke="${s.color}" stroke-width="2" class="line"/>`;
    }

    // Dots
    pts.forEach(p => {
      if (!p) return;
      svg += `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${s.color}" class="dot"><title>${p.label}: ${fmtVal(p.val)}${opts.yUnit || ''}</title></circle>`;
    });
  });

  svg += `</svg>`;
  return svg;
}

function renderBarChart(opts) {
  const W = 480, H = 200;
  const pad = { top: 18, right: 14, bottom: 28, left: 36 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;

  const values = opts.values || [];
  const n = values.length;
  if (!n) return '<svg></svg>';

  const yMax = Math.max(...values, 1) * 1.15;
  const slot = chartW / n;
  const barW = slot * 0.65;
  const fmtVal = (v) => v >= 10 ? Math.round(v) : (Math.round(v * 10) / 10);

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="trend-chart" preserveAspectRatio="xMidYMid meet">`;

  // Grid + Y labels
  for (let i = 0; i <= 4; i++) {
    const yc = pad.top + (i / 4) * chartH;
    const v = yMax - (i / 4) * yMax;
    svg += `<line x1="${pad.left}" y1="${yc}" x2="${W - pad.right}" y2="${yc}" class="grid"/>`;
    svg += `<text x="${pad.left - 5}" y="${yc + 3}" class="y-label">${fmtVal(v)}</text>`;
  }

  // Bars
  values.forEach((v, i) => {
    const cx = pad.left + slot * i + slot / 2;
    const x = cx - barW / 2;
    const barH = (v / yMax) * chartH;
    const y = pad.top + chartH - barH;
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${opts.color || '#1F5A5A'}" class="bar"><title>${opts.xLabels[i]}: ${v}${opts.yUnit || ''}</title></rect>`;
    svg += `<text x="${cx}" y="${y - 4}" class="bar-label">${v}</text>`;
    svg += `<text x="${cx}" y="${H - pad.bottom + 16}" class="x-label">${opts.xLabels[i]}</text>`;
  });

  svg += `</svg>`;
  return svg;
}

      ? `<div class="meta" style="margin-top:4px;color:var(--gold);font-weight:500">推薦率（top-2 box）: ${m.recommendPct}%</div>`

        <div class="meta">${m.n} 份有效回覆</div>

      return `<div class="sat-q"><span class="lbl">${escapeHtml(q.label)}</span><span class="val muted">—</span><span></span><span class="n">n=0</span></div>`;

        <div class="sat-bar"><div class="fill" style="width:${fillPct}%"></div></div>

  return `

      <span class="sub">${sat.totalResponses} 份回覆</span>

      <div class="sat-q-title">CARE 指標（Q1–Q10）</div>

}

  `;
}

function metricCard(label, m) {
  if (!m || m.pending) {
    return `
      <div class="mc pending">
        <div class="mc-label">${label}</div>
        <div class="mc-value muted">—</div>
        <div class="mc-meta">${m && m.note ? escapeHtml(m.note) : '尚未啟用'}</div>
      </div>
    `;
  }
  if (m.avg == null) {
    return `
      <div class="mc">
        <div class="mc-label">${label}</div>
        <div class="mc-value muted">—</div>
        <div class="mc-meta">尚無資料</div>
      </div>
    `;
  }
  return `
    <div class="mc">
      <div class="mc-label">${label}</div>
      <div class="mc-value">${m.avg}<span class="unit">${escapeHtml(m.unit || '')}</span></div>
      <div class="mc-meta">基於 ${m.count} 筆紀錄</div>
    </div>
  `;
}

function rateCard(label, defText, r, histRef) {
  const histLine = histRef
    ? `<div class="historical-ref">${escapeHtml(histRef.label || '歷史')}：<span class="hist-val">${histRef.pct}%</span>（${histRef.count} / ${histRef.total}）</div>`
    : '';
  if (!r || r.pct == null) {
    return `
      <div class="rate-card">
        <div class="rate-label">${label}</div>
        <div class="rate-def">${defText}</div>
        <div class="rate-value muted">本系統：尚無資料</div>
        ${histLine}
      </div>
    `;
  }
  return `
    <div class="rate-card">
      <div class="rate-label">${label}</div>
      <div class="rate-def">${defText}</div>
      <div class="rate-value">${r.pct}<span class="unit">%</span></div>
      <div class="rate-frac">本系統 ${r.count} / ${r.total} 位</div>
      ${histLine}
    </div>
  `;
}

// 姓名中間遮罩（個資保護）：2 字 → 王*；3 字以上 → 王*明（中間全部以 * 取代）
function maskName(name) {
  if (name == null) return '';
  const t = String(name).trim();
  if (!t) return '';
  const ch = Array.from(t);
  if (ch.length <= 1) return t;
  if (ch.length === 2) return ch[0] + '*';
  return ch[0] + '*'.repeat(ch.length - 2) + ch[ch.length - 1];
}

function renderList(items, kind) {
  if (!items || items.length === 0) {
    let msg = '目前無資料';
    if (kind === 'pending') msg = '目前沒有待開刀的病人';
    else if (kind === 'inProgress') msg = '目前沒有進行中的病人';
    else if (kind === 'closed') msg = '目前沒有已結案的病人';
    return `<div class="plist-empty">${msg}</div>`;
  }

  const rows = [];
  rows.push(`
    <div class="plist-row header">
      <div>姓名 / 性別年齡</div>
      <div>${kind === 'pending' ? '預定手術日' : '實際手術日'}</div>
      <div>術式</div>
      <div>狀態</div>
    </div>
  `);
  items.forEach(p => {
    const dateShown = kind === 'pending' ? (p.scheduledDate || '—') : (p.actualDate || p.scheduledDate || '—');
    rows.push(`
      <div class="plist-row">
        <div>
          <span class="name" title="${escapeHtml(p.pk || '')}">${escapeHtml(maskName(p.name))}</span>
          <span class="meta"> · ${escapeHtml(p.gender || '')} ${p.age != null ? p.age + ' 歲' : ''}</span>
        </div>
        <div class="date">${dateShown}</div>
        <div class="surgery">${escapeHtml(p.surgery || '—')}</div>
        <div>${statusPill(p)}</div>
      </div>
    `);
  });
  return rows.join('');
}

function statusPill(p) {
  if (p.status === '取消') return '<span class="status-pill cancelled">取消</span>';
  if (p.status === '改期') return '<span class="status-pill reschedule">改期</span>';
  if (p.status === '已完成') {
    return p.closed
      ? '<span class="status-pill cancelled">已結案</span>'
      : '<span class="status-pill completed">已完成</span>';
  }
  if (p.status === '排定中') return '<span class="status-pill scheduled">排定中</span>';
  return '<span class="status-pill cancelled">—</span>';
}

// ===== Edu pageview stats renderer =====
function renderEduStats(res) {
  // Empty 狀態
  if (res.empty) {
    return `
      <h2 class="section-title">
        <span class="num">11</span>
        <span>衛教瀏覽量統計</span>
      </h2>
      <div class="edu-empty-card">
        <div class="eec-title">尚無瀏覽紀錄</div>
        <div class="eec-desc">當病人或家屬首次點開衛教單張後,此區會顯示累計統計。<br>(系統會自動建立「瀏覽紀錄」工作表記錄每一筆瀏覽)</div>
      </div>
    `;
  }

  const t = res.totals;

  // 統計卡片
  const statCards = `
    <div class="edu-stats-grid">
      <div class="edu-stat-card" data-accent="teal">
        <div class="es-label">總瀏覽量</div>
        <div class="es-value">${t.totalViews}<span class="es-unit">次</span></div>
      </div>
      <div class="edu-stat-card" data-accent="gold">
        <div class="es-label">不重複病人</div>
        <div class="es-value">${t.uniquePatients}<span class="es-unit">位</span></div>
      </div>
      <div class="edu-stat-card" data-accent="plum">
        <div class="es-label">訪客瀏覽量</div>
        <div class="es-value">${t.guestViews}<span class="es-unit">次</span></div>
      </div>
      <div class="edu-stat-card" data-accent="navy">
        <div class="es-label">已有瀏覽的單張</div>
        <div class="es-value">${t.totalArticles}<span class="es-unit">份</span></div>
      </div>
    </div>
  `;

  // 排行(全部 byArticle,依瀏覽量排序)
  const rankRows = res.byArticle.map((a, i) => {
    const rank = i + 1;
    const rankClass = rank <= 3 ? 'top' : '';
    const durStr = a.avgDuration != null ? `${a.avgDuration} 秒` : '—';
    return `
      <div class="edu-rank-row">
        <span class="er-rank ${rankClass}">${rank}</span>
        <span class="er-code">${escapeHtml(a.code)}</span>
        <span class="er-name">${escapeHtml(a.name)}</span>
        <span class="er-views">${a.views}</span>
        <span class="er-unique">${a.uniquePatients} 位</span>
        <span class="er-dur">${durStr}</span>
      </div>
    `;
  }).join('');

  const rankCard = `
    <div class="edu-rank-card">
      <div class="erc-title">各單張瀏覽量排行</div>
      <div class="erc-sub">依累計瀏覽量排序 · 共 ${res.byArticle.length} 份單張被瀏覽過</div>
      <div class="edu-rank-row" style="border-bottom:1px solid var(--border);padding-bottom:6px;font-size:11px;color:var(--ink-faint);font-weight:600;">
        <span class="er-rank">#</span>
        <span class="er-code">代號</span>
        <span class="er-name">單張名稱</span>
        <span class="er-views">瀏覽</span>
        <span class="er-unique">不重複</span>
        <span class="er-dur">平均停留</span>
      </div>
      ${rankRows}
    </div>
  `;

  // 最近 7 日趨勢(bar chart)
  const maxDayViews = Math.max(...res.recent7Days.map(d => d.views), 1);
  const trendBars = res.recent7Days.map(d => {
    const pct = (d.views / maxDayViews) * 100;
    const zeroAttr = d.views === 0 ? 'data-zero="1"' : '';
    return `<div class="edu-trend-bar" ${zeroAttr} style="height:${pct}%">${d.views > 0 ? `<span class="etb-label">${d.views}</span>` : ''}</div>`;
  }).join('');

  const trendDates = res.recent7Days.map(d => {
    // 只顯示 MM/DD
    const md = d.date.slice(5).replace('-', '/');
    return `<span>${md}</span>`;
  }).join('');

  const trendCard = `
    <div class="edu-trend-card">
      <div class="etc-title">最近 7 日瀏覽趨勢</div>
      <div class="edu-trend-bars">${trendBars}</div>
      <div class="edu-trend-dates">${trendDates}</div>
    </div>
  `;

  return `
    <h2 class="section-title">
      <span class="num">11</span>
      <span>衛教瀏覽量統計</span>
      <span class="sub">${t.totalViews} 次累計瀏覽 · ${t.uniquePatients} 位病人</span>
    </h2>
    ${statCards}
    ${trendCard}
    ${rankCard}
  `;
}

// ===== Init =====
window.addEventListener('load', () => {
  if ($('doctor_key').value) load();
  else $('doctor_key').focus();
});
</script>
